name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --all
      - name: build
        run: cargo build --release --locked
      - name: pack
        run: |
          ver="${GITHUB_REF_NAME}"
          stage=$(mktemp -d)
          install -m 0755 target/release/ferrumdns "$stage/ferrumdns"
          cp README.md README.zh-CN.md LICENSE "$stage/"
          tar -C "$stage" -czf "ferrumdns-${ver}-x86_64-unknown-linux-gnu.tar.gz" \
            ferrumdns README.md README.zh-CN.md LICENSE
          sha256sum "ferrumdns-${ver}-x86_64-unknown-linux-gnu.tar.gz" \
            > "ferrumdns-${ver}-x86_64-unknown-linux-gnu.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ferrumdns-*.tar.gz
            ferrumdns-*.sha256
          fail_on_unmatched_files: true
