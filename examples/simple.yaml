# Local / systemd example.
# Binds :53 (needs root or CAP_NET_BIND_SERVICE) and the admin API on loopback.
# Non-root dev:  examples/dev.yaml
# Docker:        examples/docker.yaml
log:
  level: info

api:
  http: 127.0.0.1:9090

plugins:
  - tag: hosts
    type: hosts
    args:
      ttl: 60
      entries:
        - "10.0.0.1 router.lan"
        - "10.0.0.2 nas.lan"
        - "app.lan 10.0.0.10"

  - tag: ecs
    type: ecs
    args:
      ipv4: 8.8.8.8
      ipv6: "2001:4860:4860::8888"
      mask4: 24
      mask6: 48

  - tag: cache
    type: cache
    args:
      size: 8192
      lazy_cache_ttl: 86400
      lazy_cache_reply_ttl: 30

  - tag: ads
    type: domain_set
    args:
      exps:
        - ads.example.com
        - keyword:doubleclick
        - keyword:googlesyndication

  - tag: upstream
    type: forward
    args:
      concurrent: 2
      timeout: 4000
      upstreams:
        - addr: https://cloudflare-dns.com/dns-query
          tag: cloudflare
          bootstrap: 1.1.1.1
        - addr: https://dns.google/dns-query
          tag: google
          bootstrap: 8.8.8.8
        - addr: tls://1.1.1.1
          tag: cloudflare-dot

  - tag: main
    type: sequence
    args:
      - matches:
          - qname $ads
        exec: reject NXDOMAIN
      - exec: $hosts
      - matches: has_resp
        exec: accept
      - exec: $ecs
      - exec: $cache
      - matches: has_resp
        exec: accept
      - exec: $upstream

servers:
  - exec: main
    timeout: 5
    listeners:
      - protocol: udp
        addr: 0.0.0.0:53
        workers: 4
      - protocol: tcp
        addr: 0.0.0.0:53
